[package]
name = "hi_axum"
version = "0.1.0"
edition = "2024"

[lib]
name = "lib_hi_axum"
path="src/lib.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "tracing"] }
dotenvy = "0.15.7"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4"] }
